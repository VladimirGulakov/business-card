<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nubachyo — визитка</title>
  <meta name="description" content="Страница-визитка nubachyo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ec;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --accent: #e8590c;
      --border: #e6e1d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --card: #1c1c1f;
        --text: #f2f2f3;
        --muted: #9a9aa2;
        --accent: #ff8a3d;
        --border: #2c2c31;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px -25px rgba(0, 0, 0, .25);
    }
    .avatar {
      width: 96px; height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent);
      color: #fff;
      font-size: 40px; font-weight: 800;
    }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
    .role { color: var(--accent); font-weight: 600; margin-top: 4px; }
    .about { color: var(--muted); margin: 18px 0 28px; }
    .links { display: flex; flex-direction: column; gap: 10px; }
    .links a {
      display: block;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: border-color .15s, color .15s, transform .15s;
    }
    .links a:hover, .links a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      outline: none;
    }
    footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">N</div>
    <h1>nubachyo</h1>
    <p class="role">Разработчик</p>
    <p class="about">Привет! Здесь пара слов о себе: чем занимаюсь, что люблю делать и как со мной связаться.</p>
    <nav class="links">
      <a href="https://github.com/nubachyo" target="_blank" rel="noopener">GitHub</a>
      <a href="https://t.me/" target="_blank" rel="noopener">Telegram</a>
      <a href="mailto:hello@example.com">Написать на почту</a>
    </nav>
    <footer>© <span id="y"></span> nubachyo</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
